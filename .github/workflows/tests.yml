name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-runtime.txt pytest
      - name: Run Python tests
        run: python -m pytest -q tests
      - name: Check shell syntax
        run: |
          bash -n scripts/h3_comfui_base.sh
          bash -n scripts/h3_profile_common.sh
          for script in scripts/setupp_h3_comfui*.sh scripts/setupp_h3_studio.sh; do
            bash -n "$script"
          done

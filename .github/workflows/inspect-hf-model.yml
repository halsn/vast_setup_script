name: inspect-hf-model

on:
  push:
    branches:
      - update/h3-accelerators-20260916
    paths:
      - .github/workflows/inspect-hf-model.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pinned FastH3 model metadata
        shell: python
        run: |
          import json
          import urllib.parse
          import urllib.request

          repo = "FastVideo/FastVideo-FastH3-Comfy"
          revision = "567165f0412203f6629b98982f82a154bd7474a0"
          filename = "diffusion_models/fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors"
          url = f"https://huggingface.co/api/models/{repo}/revision/{revision}?blobs=true"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)
          match = next((item for item in data.get("siblings", []) if item.get("rfilename") == filename), None)
          if not match:
              raise SystemExit("Pinned model file not found in metadata")
          print("FASTH3_FILE_METADATA=" + json.dumps(match, sort_keys=True))
